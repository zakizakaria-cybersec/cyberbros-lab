name: Deploy to Staging

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  deploy-workers-staging:
    runs-on: ubuntu-latest
    name: Deploy Workers to Staging
    if: contains(github.event.pull_request.changed_files, 'workers/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./workers
        run: npm ci

      - name: Deploy to Staging
        working-directory: ./workers
        run: |
          if [ -f wrangler.staging.toml ]; then
            npx wrangler deploy --config wrangler.staging.toml
          else
            echo "⚠️  No staging config found. Skipping staging deployment."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Workers deployed to staging! Check logs for details.'
            })
